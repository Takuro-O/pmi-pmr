    timeout:     '時間がかかりすぎました。もう一度お試しください。',
    truncated:   '問題が長すぎます。問題数を減らしてください。',
    blocked:     '生成に失敗しました。もう一度お試しください。',
    bad_request: '生成に失敗しました。もう一度お試しください。',
    invalid:     '生成に失敗しました。もう一度お試しください。',
  };

  // ── 問題表示 ───────────────────────────────────
  function makeMetaTag(text, kind) {
    const el = document.createElement('span');
    const c = kind === 'warn' ? 'color:var(--c-warning);background:var(--c-warn-bg);' : 'color:var(--c-primary-text);background:var(--c-primary-light);';
    el.style.cssText = 'font-size:var(--fs-xs);font-weight:700;padding:2px 8px;border-radius:10px;' + c;
    el.textContent = text;
    return el;
  }

  function renderQuestion() {
    const q     = quizSession.questions[quizSession.current];
    const total = quizSession.questions.length;
    const idx   = quizSession.current;

    // プログレス & カウンター
    document.getElementById('quiz-progress').style.width = ((idx / total) * 100) + '%';
    document.getElementById('quiz-counter').textContent  = `${idx + 1} / ${total}`;
    const bar = document.getElementById('quiz-progress-bar');
    bar.setAttribute('aria-valuenow', String(Math.round(idx / total * 100)));
    bar.setAttribute('aria-valuetext', `${idx + 1}問目 / 全${total}問`);

    // [MAJOR修正] 中断ボタンにイベントを付与
    const backBtn = document.getElementById('quiz-back-btn');
    backBtn.onclick = openQuitDialog;

    // [CRITICAL修正] メタ情報は全て textContent / DOM API でセット
    const field      = quizSession.field;
    const metaEl     = document.getElementById('quiz-meta');
    metaEl.innerHTML = '';

    const fieldTag = document.createElement('span');
    fieldTag.className = 'tag';
    fieldTag.setAttribute('aria-label', `分野：${field.name}`);
    fieldTag.textContent = field.icon + ' ' + field.name;

    metaEl.appendChild(fieldTag);

    if (quizSession.isReview) {
      const reviewTag = document.createElement('span');
      reviewTag.style.cssText = 'font-size:var(--fs-xs);font-weight:700;color:var(--c-warning);background:var(--c-warn-bg);padding:2px 8px;border-radius:10px;';
      reviewTag.textContent = '復習';
      metaEl.appendChild(reviewTag);
    }
    if (quizSession.useSource) metaEl.appendChild(makeMetaTag('資料', 'primary'));
    if (q.volatile) metaEl.appendChild(makeMetaTag('版により変わる内容', 'warn'));

    if (q.topic) {
      const topicTag = document.createElement('span');
      topicTag.style.cssText = 'font-size:var(--fs-xs);color:var(--c-sub);background:var(--c-surface);padding:2px 8px;border-radius:10px;';
      topicTag.textContent = q.fieldName ? `${q.fieldName} ／ ${q.topic}` : q.topic;
      metaEl.appendChild(topicTag);
    }

    // 問題文（textContent で安全にセット）
    const questionEl = document.getElementById('quiz-question');
    questionEl.textContent = q.q;
    questionEl.style.animation = 'none';
    requestAnimationFrame(() => { questionEl.style.animation = 'fadeIn 0.3s ease'; });

    // 選択肢（DOM API で生成）
    const choicesEl = document.getElementById('quiz-choices');
    choicesEl.innerHTML = '';
    q.choices.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn tappable';
      btn.dataset.idx = i;
      btn.setAttribute('aria-label', `選択肢${LABELS[i]}：${choice}`);
      btn.textContent = LABELS[i] + '. ' + choice;
      btn.onclick = () => handleAnswer(i);
      choicesEl.appendChild(btn);
    });

    document.getElementById('quiz-explanation').style.display = 'none';
    document.getElementById('quiz-nav').style.display = 'none';

    // 問題が切り替わったことをスクリーンリーダーに伝えるため、問題文へフォーカス
    if (_booted) questionEl.focus({ preventScroll: true });

    // 途中再開：この問題がすでに回答済みなら、回答後の表示を復元する
    if (quizSession.answers.length > idx) showAnswerUI(q, quizSession.answers[idx].chosen);
  }

  function handleAnswer(chosenIdx) {
    // 二重タップ防止（回答済みの問題には答えられない）
    if (quizSession.answers.length > quizSession.current) return;
    const q       = quizSession.questions[quizSession.current];
    const isRight = chosenIdx === q.answer;
    quizSession.answers.push({ chosen: chosenIdx, correct: q.answer, isRight });
    saveProgress();
    showAnswerUI(q, chosenIdx);
  }

  // 回答後の表示（正誤の色分け・解説・次へボタン）。回答時と途中再開時で共通
  function showAnswerUI(q, chosenIdx) {
    const isRight = chosenIdx === q.answer;

    // ボタン状態更新
    document.querySelectorAll('.choice-btn').forEach((btn, i) => {
      btn.disabled = true;
      btn.removeAttribute('onclick');
      if (i === q.answer) {
        btn.classList.add('correct');
        btn.setAttribute('aria-label', btn.getAttribute('aria-label') + '（正解）');
      } else if (i === chosenIdx && !isRight) {
        btn.classList.add('incorrect');
        btn.setAttribute('aria-label', btn.getAttribute('aria-label') + '（あなたの解答・不正解）');
      }
    });

    // [CRITICAL修正] 解説 innerHTML は esc() 経由で安全に
    const expEl = document.getElementById('quiz-explanation');
    const resultIcon  = isRight ? '✅' : '❌';
    const resultLabel = isRight ? '正解！' : '不正解';
    const resultColor = isRight ? 'var(--c-success)' : 'var(--c-danger)';
    const correctNote = !isRight ? `<span style="font-size:var(--fs-base);color:var(--c-sub)">正解：${LABELS[q.answer]}</span>` : '';

    expEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="font-size:18px;" aria-hidden="true">${resultIcon}</span>
        <span style="font-weight:700;color:${resultColor}">${resultLabel}</span>
        ${correctNote}
      </div>
      <div style="font-size:var(--fs-base);color:var(--c-text-2);">${esc(q.explanation)}</div>
      ${q.volatile ? '<div style="font-size:var(--fs-sm);color:var(--c-warning);font-weight:600;margin-top:10px;">※PMBOK ガイドの版や PMI の資格制度の改訂で変わりやすい内容です。PMI の公式資料で最新の情報を確認してください。</div>' : ''}
      <div style="font-size:var(--fs-xs);color:var(--c-sub);margin-top:10px;">※AI生成のため、公式テキストで確認を</div>
    `;
    expEl.style.display = 'block';
    expEl.style.animation = 'none';
    requestAnimationFrame(() => { expEl.style.animation = 'fadeIn 0.3s ease'; });

    // ナビボタン（DOM API）
    const navEl  = document.getElementById('quiz-nav');
    const isLast = quizSession.current >= quizSession.questions.length - 1;
    navEl.innerHTML = '';
    const navBtn = document.createElement('button');
    navBtn.className = 'tappable';
    navBtn.textContent = isLast ? '結果を見る' : '次の問題 →';
    navBtn.setAttribute('aria-label', isLast ? '結果を見る' : '次の問題へ');
    Object.assign(navBtn.style, {
      width: '100%', height: '52px', background: 'var(--c-primary)',
      color: '#fff', border: 'none', borderRadius: 'var(--radius-s)',
      fontSize: 'var(--fs-lg)', fontWeight: '700',
    });
    navBtn.onclick = isLast ? finishQuiz : nextQuestion;
    navEl.appendChild(navBtn);
    navEl.style.display = 'block';

    setTimeout(() => expEl.scrollIntoView({ behavior: (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth', block: 'nearest' }), 100);
  }

  function nextQuestion() {
    quizSession.current++;
    saveProgress();
    renderQuestion();
    document.querySelector('main').scrollTop = 0;
  }

  function finishQuiz() {
    const correct = quizSession.answers.filter(a => a.isRight).length;
    const record  = {
      id:        crypto.randomUUID?.() ?? (Date.now() + '-' + Math.random().toString(36).slice(2)),
      date:      new Date().toISOString(),
      field:     quizSession.field.id,
      fieldName: quizSession.field.name,
      fieldIcon: quizSession.field.icon,
      review:    !!quizSession.isReview,
      source:    !!quizSession.useSource,
      count:     quizSession.questions.length,
      correct,
      questions: quizSession.questions.map((q, i) => ({
        ...q,
        userAnswer: quizSession.answers[i]?.chosen,
        isRight:    quizSession.answers[i]?.isRight,
      })),
    };

    state.history.unshift(record);
    if (state.history.length > MAX_HISTORY) state.history = state.history.slice(0, MAX_HISTORY);
    clearProgress();
    state.totalAnswered = (state.totalAnswered || 0) + record.count;
    state.totalCorrect  = (state.totalCorrect  || 0) + correct;
    saveState();

    showPage('result');
    renderResult(record);
  }

  // ── [MAJOR修正] クイズ中断ダイアログ ─────────────
  function openQuitDialog() {
    document.getElementById('quit-dialog').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    activateModal(document.getElementById('quit-dialog'), closeQuitDialog);
  }
  function closeQuitDialog() {
    const d = document.getElementById('quit-dialog');
    d.style.display = 'none';
    document.body.style.overflow = '';
    deactivateModal(d);
  }
  function doQuitQuiz() {
    closeQuitDialog();
    clearProgress();
    showPage('home');
  }

  // ── 結果表示 ───────────────────────────────────
  function renderResult(record) {
    const rate   = Math.round(record.correct / record.count * 100);
    const passed = rate >= PASS_RATE;

    const circle = document.getElementById('result-circle');
    circle.style.background = passed
      ? 'linear-gradient(135deg, var(--c-ok-grad1), var(--c-ok-grad2))'
      : 'linear-gradient(135deg, var(--c-ng-grad1), var(--c-ng-grad2))';
    // 数値のみ（外部データなし）なので直書き安全
    circle.innerHTML = `
      <div style="font-size:36px;font-weight:900;color:${passed ? 'var(--c-ok-text)' : 'var(--c-ng-text)'}">${rate}%</div>
    `;

    document.getElementById('result-msg').textContent = passed
      ? `目標達成（${PASS_RATE}%以上）`
      : `あと少し（目標${PASS_RATE}%）`;

    // [CRITICAL修正] fieldName, fieldIcon を esc() 経由
    document.getElementById('result-sub').textContent =
      `${record.fieldIcon} ${record.fieldName} ／ ${record.correct} / ${record.count}問`;

    document.getElementById('result-stats').innerHTML = `
      <div class="stat-card"><div class="stat-num">${record.correct}</div><div class="stat-label">正解数</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--c-danger)">${record.count - record.correct}</div><div class="stat-label">不正解数</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--c-warning)">${rate}%</div><div class="stat-label">正答率</div></div>
    `;

    // 間違い問題レビュー（[CRITICAL修正] 全フィールドを esc() 経由）
    const wrong    = record.questions.filter(q => !q.isRight);
    const reviewEl = document.getElementById('result-review');
    if (wrong.length === 0) {
      reviewEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--c-success);font-weight:700;">全問正解！</div>`;
    } else {
      reviewEl.innerHTML = `
        <p style="font-size:var(--fs-base);font-weight:600;color:var(--c-sub);margin-bottom:12px;">間違えた問題 (${wrong.length}問)</p>
        <p style="font-size:var(--fs-xs);color:var(--c-sub);margin-bottom:12px;">※AI生成のため、公式テキストで確認を</p>
        ${wrong.map(q => `
          <div style="background:var(--c-surface);border-radius:var(--radius-m);padding:14px;margin-bottom:10px;border-left:3px solid var(--c-danger);">
            ${q.volatile ? '<span class="tag" style="font-size:var(--fs-xs);color:var(--c-warning);background:var(--c-warn-bg);margin-bottom:6px;">版により変わる内容</span>' : ''}
            <p style="font-size:var(--fs-base);font-weight:600;margin-bottom:6px;color:var(--c-text);">${esc(q.q)}</p>
            <p style="font-size:var(--fs-sm);color:var(--c-success);">✓ 正解：${LABELS[q.answer]}. ${esc(q.choices[q.answer])}</p>
            <p style="font-size:var(--fs-sm);color:var(--c-sub);margin-top:6px;">${esc(q.explanation)}</p>
          </div>
        `).join('')}
      `;
    }

    // 間違えた問題だけ復習（AI呼び出しなし）
    const reviewWrap = document.getElementById('review-btn-wrap');
    reviewWrap.innerHTML = '';
    if (wrong.length > 0) reviewWrap.appendChild(makeReviewButton(record, wrong.length));

    document.getElementById('retry-btn').onclick = () => {
      openConfig(record.field);
      showPage('home');
    };
  }

  // ── 復習 ──────────────────────────────────────
  function makeReviewButton(record, wrongCount) {
    const btn = document.createElement('button');
    btn.className = 'tappable';
    btn.textContent = `間違えた${wrongCount}問を復習`;
    Object.assign(btn.style, {
      width: '100%', height: '48px', background: 'var(--c-primary-light)',
      color: 'var(--c-primary-text)', border: '1.5px solid var(--c-primary)',
      borderRadius: 'var(--radius-s)', fontSize: 'var(--fs-md)', fontWeight: '700',
    });
    btn.onclick = () => startReview(record);
    return btn;
  }

  function startReview(record) {
    const f = FIELDS.find(x => x.id === record.field);
    const wrong = (record.questions || []).filter(q => !q.isRight && Array.isArray(q.choices));
    if (!f || wrong.length === 0) { showToast('復習できる問題がありません。', 'info'); return; }

    // 選択肢の順番を入れ替えて、位置で覚えてしまうのを防ぐ
    const qs = wrong.map(q => {
      const order = shuffle(q.choices.map((_, i) => i));
      return {
        q: q.q,
        choices: order.map(i => q.choices[i]),
        answer: order.indexOf(q.answer),
        explanation: q.explanation,
        topic: q.topic || '',
        volatile: !!q.volatile,
      };
    });
    Object.assign(quizSession, {
      field: f, count: qs.length,
      questions: qs, current: 0, answers: [], isReview: true, useSource: !!record.source,
    });
    saveProgress();
    showPage('quiz');
    renderQuestion();
    document.querySelector('main').scrollTop = 0;
  }

  // ── 履歴の詳細 ─────────────────────────────────
  function openDetail(id) {
    const record = state.history.find(h => h.id === id);
    if (!record) return;
    renderDetail(record);
    showPage('detail');
  }

  function renderDetail(record) {
    const body  = document.getElementById('detail-body');
    const qs    = Array.isArray(record.questions) ? record.questions : [];
    const wrong = qs.filter(q => !q.isRight);
    const rate  = record.count > 0 ? Math.round(record.correct / record.count * 100) : 0;
    const d     = new Date(record.date);
    const dateStr = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

    body.innerHTML = `
      <button id="detail-back" class="tappable" style="background:none;border:none;font-size:var(--fs-base);color: var(--c-primary-text);font-weight:600;padding:4px 0 12px;">← 成績に戻る</button>
      <div style="margin-bottom:16px;">
        <div style="font-size:var(--fs-lg);font-weight:700;">${esc(record.fieldIcon)} ${esc(record.fieldName)}${record.review ? ' <span class="tag" style="color:var(--c-warning);background:var(--c-warn-bg);">復習</span>' : ''}${record.source ? ' <span class="tag">資料</span>' : ''}</div>
        <div style="font-size:var(--fs-sm);color:var(--c-sub);margin-top:2px;">${esc(dateStr)} ／ ${record.correct} / ${record.count}問（${rate}%）</div>
      </div>
      <div id="detail-review-wrap"></div>
      ${record.slim ? `<div style="text-align:center;padding:32px 16px;color:var(--c-sub);font-size:var(--fs-base);line-height:1.7;">この履歴の問題文は保存されていません。（古い形式の履歴）</div>` : `
      <p style="font-size:var(--fs-xs);color:var(--c-sub);margin:12px 0;">※AI生成のため、公式テキストで確認を</p>
      ${qs.map((q, n) => {
        const choices = Array.isArray(q.choices) ? q.choices : [];
        const ok = !!q.isRight;
        return `
          <div style="background:var(--c-surface);border-radius:var(--radius-m);padding:14px;margin-bottom:12px;border-left:3px solid ${ok ? 'var(--c-success)' : 'var(--c-danger)'};">
            <div style="font-size:var(--fs-sm);color:var(--c-sub);margin-bottom:4px;">第${n + 1}問 ${ok ? '✅ 正解' : '❌ 不正解'}${q.topic ? ' ／ ' + esc(q.topic) : ''}${q.volatile ? ' ／ 版により変わる内容' : ''}</div>
            <p style="font-size:var(--fs-base);font-weight:600;margin-bottom:10px;">${esc(q.q)}</p>
            ${choices.map((c, i) => {
              const isAns = i === q.answer;
              const isMine = i === q.userAnswer;
              const color = isAns ? 'var(--c-ok-text)' : (isMine ? 'var(--c-ng-text)' : 'var(--c-text)');
              const bg = isAns ? 'var(--c-ok-bg)' : (isMine ? 'var(--c-ng-bg)' : 'var(--c-bg)');
              const mark = isAns ? ' ✓正解' : (isMine ? ' ✕あなたの解答' : '');
              return `<div style="font-size:var(--fs-base);padding:8px 10px;margin-bottom:6px;border-radius:var(--radius-s);background:${bg};color:${color};border:1px solid var(--c-border);">${LABELS[i] || ''}. ${esc(c)}<b style="font-size:var(--fs-xs);">${mark}</b></div>`;
            }).join('')}
            <p style="font-size:var(--fs-sm);color:var(--c-text-2);margin-top:8px;line-height:1.7;">${esc(q.explanation)}</p>
          </div>`;
      }).join('')}`}
    `;

    document.getElementById('detail-back').onclick = () => showPage('stats');
    if (wrong.length > 0 && !record.slim) document.getElementById('detail-review-wrap').appendChild(makeReviewButton(record, wrong.length));
  }

  // ── 苦手テーマ集計 ─────────────────────────────
  function computeTopicStats() {
    const map = new Map();
    state.history.forEach(h => {
      (Array.isArray(h.questions) ? h.questions : []).forEach(q => {
        const topic = typeof q.topic === 'string' ? q.topic.trim() : '';
        if (!topic || typeof q.isRight !== 'boolean') return;
        const key = (q.fieldId || h.field) + '::' + topic;
        if (!map.has(key)) map.set(key, { topic, icon: q.fieldIcon || h.fieldIcon, field: q.fieldName || h.fieldName, n: 0, ok: 0 });
        const t = map.get(key);
        t.n++;
        if (q.isRight) t.ok++;
      });
    });
    return [...map.values()]
      .filter(t => t.n >= 2)
      .map(t => ({ ...t, rate: Math.round(t.ok / t.n * 100) }))
      .sort((a, b) => a.rate - b.rate || b.n - a.n);
  }

  // ── 成績 ──────────────────────────────────────
  function renderStats() {
    const total    = state.totalAnswered || 0;
    const correct  = state.totalCorrect  || 0;
    const rate     = total > 0 ? Math.round(correct / total * 100) : 0;
    const sessions = state.history.length;

    document.getElementById('overall-stats').innerHTML = `
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">総問題数</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${total > 0 && rate >= PASS_RATE ? 'var(--c-success)' : total > 0 ? 'var(--c-danger)' : 'var(--c-primary-text)'}">${total > 0 ? rate + '%' : '–'}</div><div class="stat-label">総正答率</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--c-warning)">${sessions}</div><div class="stat-label">挑戦回数</div></div>
    `;

    // 分野別（[CRITICAL修正] fs.name, fs.icon は history から取得 → esc() で保護）
    const fieldStats = {};
    state.history.forEach(h => {
      if (!fieldStats[h.field]) fieldStats[h.field] = { answered: 0, correct: 0, name: h.fieldName, icon: h.fieldIcon };
      fieldStats[h.field].answered += h.count;
      fieldStats[h.field].correct  += h.correct;
    });

    const fieldEl = document.getElementById('field-stats');
    if (Object.keys(fieldStats).length === 0) {
      fieldEl.innerHTML = `<div style="text-align:center;padding:32px;color:var(--c-sub);font-size:var(--fs-base);">まだ記録がありません</div>`;
    } else {
      fieldEl.innerHTML = Object.entries(fieldStats).map(([, fs]) => {
        const r = Math.round(fs.correct / fs.answered * 100);
        return `
          <div style="background:var(--c-surface);border-radius:var(--radius-m);padding:14px;margin-bottom:10px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <span style="font-size:var(--fs-base);font-weight:600;">${esc(fs.icon)} ${esc(fs.name)}</span>
              <span style="font-weight:700;color:${r >= PASS_RATE ? 'var(--c-success)' : 'var(--c-danger)'}">${r}%</span>
            </div>
            <div style="height:6px;background:var(--c-border);border-radius:3px;overflow:hidden;" role="progressbar" aria-valuenow="${r}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(fs.name)} 正答率">
              <div style="height:100%;width:${r}%;background:${r >= PASS_RATE ? 'var(--c-success)' : 'var(--c-danger)'};border-radius:3px;transition:width 0.5s ease;"></div>
            </div>
            <div style="font-size:var(--fs-sm);color:var(--c-sub);margin-top:4px;">${fs.correct} / ${fs.answered}問</div>
          </div>
        `;
      }).join('');
    }

    // 苦手テーマ（正答率の低い順に最大5件。100%のテーマは除外）
    const topicEl = document.getElementById('topic-stats');
    const weak = computeTopicStats().filter(t => t.rate < 100).slice(0, 5);
    if (weak.length === 0) {
      const hasData = state.history.length > 0;
      topicEl.innerHTML = `<div style="text-align:center;padding:24px;color:var(--c-sub);font-size:var(--fs-base);">${hasData ? '苦手テーマなし' : 'まだ記録がありません'}</div>`;
    } else {
      topicEl.innerHTML = weak.map(t => `
        <div style="background:var(--c-surface);border-radius:var(--radius-m);padding:12px 14px;margin-bottom:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <span style="font-size:var(--fs-base);font-weight:600;min-width:0;overflow-wrap:anywhere;">${esc(t.topic)}</span>
            <span style="font-weight:700;flex-shrink:0;color:${t.rate >= PASS_RATE ? 'var(--c-warning)' : 'var(--c-danger)'}">${t.rate}%</span>
          </div>
          <div style="font-size:var(--fs-sm);color:var(--c-sub);margin-top:2px;">${esc(t.icon)} ${esc(t.field)} ／ ${t.ok} / ${t.n}問</div>
        </div>
      `).join('');
    }

    // 履歴
    const histEl = document.getElementById('history-list');
    if (state.history.length === 0) {
      histEl.innerHTML = `<div style="text-align:center;padding:32px;color:var(--c-sub);font-size:var(--fs-base);">まだ記録がありません</div>`;
    } else {
      histEl.innerHTML = state.history.slice(0, 20).map(h => {
        const r          = Math.round(h.correct / h.count * 100);
        const d          = new Date(h.date);
        const dateStr    = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        return `
          <button type="button" class="history-item tappable" data-id="${esc(h.id)}" aria-label="${esc(h.fieldName)} ${r}% 詳細を見る"
            style="display:block;width:100%;text-align:left;color:inherit;font-size:inherit;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <span style="font-size:var(--fs-base);font-weight:600;">${esc(h.fieldIcon)} ${esc(h.fieldName)}${h.review ? ' <span class="tag" style="font-size:var(--fs-xs);color:var(--c-warning);background:var(--c-warn-bg);">復習</span>' : ''}${h.source ? ' <span class="tag" style="font-size:var(--fs-xs);">資料</span>' : ''}</span>
              <span style="font-weight:700;font-size:var(--fs-lg);color:${r >= PASS_RATE ? 'var(--c-success)' : 'var(--c-danger)'}">${r}%</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <span style="font-size:var(--fs-sm);color:var(--c-sub);">${h.correct} / ${h.count}問</span>
              <span style="font-size:var(--fs-sm);color:var(--c-sub);margin-left:auto;">${dateStr}</span>
            </div>
          </button>
        `;
      }).join('');
      histEl.onclick = e => {
        const item = e.target.closest('[data-id]');
        if (item) openDetail(item.dataset.id);
      };
    }
  }

  // ── [MAJOR修正] カスタム確認ダイアログ（confirm() → カスタムモーダル） ──
  function showConfirm({ title, message, label, onOk }) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent   = message;
    const okBtn = document.getElementById('confirm-ok');
    okBtn.textContent = label || '実行する';
    okBtn.onclick = () => { closeConfirm(); onOk(); };

    const dialog = document.getElementById('confirm-dialog');
    dialog.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    activateModal(dialog, closeConfirm);
  }

  function closeConfirm() {
    const d = document.getElementById('confirm-dialog');
    d.style.display = 'none';
    document.body.style.overflow = '';
    deactivateModal(d);
  }

  function confirmReset() {
    showConfirm({
      title:   '学習履歴をリセット',
      message: 'すべての記録が消えます。元に戻せません。',
      label:   'リセットする',
      onOk:    () => {
        state = defaultState();
        saveState();
        renderStats();
        showToast('リセットしました', 'info');
      },
    });
  }

  // ── モーダル共通：フォーカス移動・Tab循環・Esc・背景の操作無効化 ──
  const FOCUSABLE = 'summary, button:not([disabled]), input:not([disabled]), select, textarea, a[href], [tabindex]:not([tabindex="-1"])';

  function activateModal(dialog, onEscape) {
    if (dialog._modal) return;
    const ac = new AbortController();
    dialog._modal = { ac, opener: document.activeElement };
    document.getElementById('app').setAttribute('inert', ''); // 背景をスクリーンリーダー・Tab操作の対象外に
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); onEscape(); return; }
      if (e.key !== 'Tab') return;
      const items = [...dialog.querySelectorAll(FOCUSABLE)].filter(el => el.getClientRects().length > 0);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1], a = document.activeElement;
      if (e.shiftKey && (a === first || !dialog.contains(a))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (a === last || !dialog.contains(a))) { e.preventDefault(); first.focus(); }
    }, { signal: ac.signal });
    const target = dialog.querySelector('[data-autofocus]') || dialog.querySelector(FOCUSABLE);
    if (target) target.focus({ preventScroll: true });
  }

  function deactivateModal(dialog) {
    const m = dialog._modal;
    if (!m) return;
    m.ac.abort();
    dialog._modal = null;
    document.getElementById('app').removeAttribute('inert');
    const o = m.opener; // 開いた時の要素にフォーカスを戻す
    if (o && o !== document.body && document.contains(o)) o.focus({ preventScroll: true });
  }

  // ── ユーティリティ ─────────────────────────────
  function showLoading(msg = '処理中…') {
    document.getElementById('loading-msg').textContent = msg;
    document.getElementById('loading-overlay').style.display = 'flex';
  }
  function hideLoading() {
    document.getElementById('loading-overlay').style.display = 'none';
  }

  function showToast(message, type = 'success') {
    const colors = { success: '#15803d', error: '#dc2626', info: '#3730a3' }; // 白文字で読めるコントラスト
    const icons  = { success: '✓',      error: '✕',       info: 'ℹ' };
    const t = document.createElement('div');
    t.setAttribute('role', 'alert');
    t.setAttribute('aria-live', 'polite');

    const iconEl = document.createElement('b');
    iconEl.setAttribute('aria-hidden', 'true');
    iconEl.textContent = icons[type] || '✓';

    const msgEl = document.createElement('span');
    msgEl.textContent = ' ' + message;

    t.appendChild(iconEl);
    t.appendChild(msgEl);

    Object.assign(t.style, {
      position: 'fixed',
      bottom: 'calc(76px + env(safe-area-inset-bottom))',
      left: '50%', transform: 'translateX(-50%) translateY(8px)',
      background: colors[type] || colors.success,
      color: '#fff', padding: '10px 18px',
      borderRadius: '20px', fontSize: 'var(--fs-base)', fontWeight: '600',
      zIndex: String(1000), width: 'max-content', maxWidth: 'calc(100vw - 32px)',
      textAlign: 'left', lineHeight: '1.5',
      boxShadow: '0 4px 16px rgba(0,0,0,0.15)',
      transition: 'opacity 0.25s, transform 0.25s', opacity: '0',
    });
    document.body.appendChild(t);
    requestAnimationFrame(() => {
      t.style.opacity   = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(() => {
      t.style.opacity = '0';
      t.addEventListener('transitionend', () => t.remove(), { once: true });
    }, 3000);
  }

  // グローバル公開（インライン onclick 用）
  window.showPage        = showPage;
  window.openConfig      = openConfig;
  window.closeConfigModal = closeConfigModal;
  window.selectCount     = selectCount;
  window.selectFocus     = selectFocus;
  window.startQuiz       = startQuiz;
  window.nextQuestion    = nextQuestion;
  window.finishQuiz      = finishQuiz;
  window.confirmReset    = confirmReset;
  window.closeConfirm    = closeConfirm;
  window.closeQuitDialog = closeQuitDialog;
  window.doQuitQuiz      = doQuitQuiz;

  // ── キーボード操作（1〜4 / A〜D で回答、Enter・N・→ で次へ） ──
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    if (!document.getElementById('page-quiz').classList.contains('active')) return;
    if (document.getElementById('app').hasAttribute('inert')) return; // ダイアログ表示中
    if (document.getElementById('loading-overlay').style.display === 'flex') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const idx = k.length === 1 ? ('1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k)) : -1;
    if (idx >= 0) {
      const btn = document.querySelectorAll('#quiz-choices .choice-btn')[idx];
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      return;
    }
    if (k === 'Enter' || k === 'n' || k === 'ArrowRight') {
      const nav = document.getElementById('quiz-nav');
      const navBtn = nav.style.display !== 'none' ? nav.querySelector('button') : null;
      if (!navBtn) return;
      // ボタンにフォーカス中のEnterはブラウザ標準の動作に任せる（二重実行防止）
      if (k === 'Enter' && tag === 'BUTTON') return;
      e.preventDefault();
      navBtn.click();
    }
  });

  // ── 初期化 ────────────────────────────────────
  document.getElementById('source-input').addEventListener('input', () => { updateSourceCount(); updateFocusHint(); });
  showPage('home');
  _booted = true;
})();
</script>
